name: HeartCoach
options:
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "15.4"

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  HeartRateCoachCore:
    path: HeartRateCoachCore

targets:
  HeartCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HeartCoach
        # Ship only the Barlow faces the UI actually uses (see WorkoutTheme.swift);
        # exclude the rest of the family to keep the bundle lean.
        excludes:
          - "Fonts/*Italic*.ttf"
          - "Fonts/Barlow-Thin.ttf"
          - "Fonts/Barlow-ExtraLight.ttf"
          - "Fonts/Barlow-Light.ttf"
          - "Fonts/Barlow-ExtraBold.ttf"
          - "Fonts/Barlow-Black.ttf"
          - "Fonts/BarlowCondensed-Thin.ttf"
          - "Fonts/BarlowCondensed-ExtraLight.ttf"
          - "Fonts/BarlowCondensed-Light.ttf"
          - "Fonts/BarlowCondensed-Regular.ttf"
          - "Fonts/BarlowCondensed-Black.ttf"
    resources:
      - path: HeartCoach/Offline/OfflineQueue.xcdatamodeld
    info:
      path: HeartCoach/Info.plist
      properties:
        CFBundleName: HeartCoach
        CFBundleDisplayName: HeartCoach
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSHealthShareUsageDescription: "HeartCoach reads your heart rate to provide personalised coaching during workouts."
        NSHealthUpdateUsageDescription: "HeartCoach needs access to your health data to read your heart rate."
        NSSupportsLiveActivities: false
        # Keep speaking coaching cues while the phone is pocketed/backgrounded.
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - Barlow-Bold.ttf
          - BarlowCondensed-Medium.ttf
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
    entitlements:
      path: HeartCoach/HeartCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseStorage
      - package: HeartRateCoachCore
        product: HeartRateCoachCore
      - sdk: WatchConnectivity.framework
      - target: HeartCoachWatch
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.golkoosh.heartcoach
        DEVELOPMENT_TEAM: "Z5F9A35728"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: HeartCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HeartCoachWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HeartCoachWatch
      # Barlow Condensed faces used by the Watch broadcast view (shared from the
      # iPhone Fonts folder); only the two weights the Watch renders.
      - path: HeartCoach/Fonts/BarlowCondensed-ExtraBold.ttf
      - path: HeartCoach/Fonts/BarlowCondensed-Bold.ttf
    info:
      path: HeartCoachWatch/Info.plist
      properties:
        CFBundleName: HeartCoachWatch
        CFBundleDisplayName: HeartCoach
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        WKApplication: true
        UIAppFonts:
          - BarlowCondensed-ExtraBold.ttf
          - BarlowCondensed-Bold.ttf
        WKCompanionAppBundleIdentifier: com.golkoosh.heartcoach
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "HeartCoach reads your heart rate during workouts."
        NSHealthUpdateUsageDescription: "HeartCoach writes workout data to your health records."
    entitlements:
      path: HeartCoachWatch/HeartCoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: HeartRateCoachCore
        product: HeartRateCoachCore
      - sdk: WatchConnectivity.framework
      - sdk: HealthKit.framework
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.golkoosh.heartcoach.watchkitapp
        DEVELOPMENT_TEAM: "Z5F9A35728"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: HeartCoachWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HeartCoachWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HeartCoachWatchTests
    dependencies:
      - target: HeartCoachWatch
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.golkoosh.heartcoach.watchkitapptests
        DEVELOPMENT_TEAM: "Z5F9A35728"
        GENERATE_INFOPLIST_FILE: YES

  HeartCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HeartCoachTests
    dependencies:
      - target: HeartCoach
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.golkoosh.heartcoachtests
        DEVELOPMENT_TEAM: "Z5F9A35728"
        GENERATE_INFOPLIST_FILE: YES
